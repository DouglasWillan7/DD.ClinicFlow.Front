name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-clinicflow-front
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/douglaswillan7/dd.clinicflow.front

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=https://clinicflow-api.dwsolucoes.tech
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o frontend na VPS e verificar saúde
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            cd /opt/dwexpenses/clinicflow-api
            docker compose pull clinicflow-web
            docker compose up -d clinicflow-web

            container_id="$(docker compose ps -q clinicflow-web)"
            if [ -z "$container_id" ]; then
              echo "container clinicflow-web não foi criado" >&2
              exit 1
            fi

            attempt=1
            while [ "$attempt" -le 24 ]; do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  docker image prune -f
                  exit 0
                  ;;
                unhealthy)
                  echo "clinicflow-web ficou unhealthy" >&2
                  docker compose logs --no-color --tail=200 clinicflow-web
                  exit 1
                  ;;
              esac

              sleep 5
              attempt=$((attempt + 1))
            done

            echo "timeout aguardando healthcheck do clinicflow-web" >&2
            docker compose logs --no-color --tail=200 clinicflow-web
            exit 1
